[project]
name = "offline-study-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ctranslate2>=4.8.5",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "rapidocr>=3.10.0",
    "sentencepiece>=0.2.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
